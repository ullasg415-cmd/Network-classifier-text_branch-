# Apache Tika server for the text branch. Valid on its own:
#
#   docker compose -f text/docker-compose.tika.yml up -d tika      # start   (Tika listens on http://localhost:9998)
#   curl http://localhost:9998/tika                                # health: a greeting means it is up
#   docker compose -f text/docker-compose.tika.yml down            # stop and remove
#
# Config validity of this file was checked with `docker compose config` (no daemon needed).
# The container itself was NOT started in the environment this was prepared in: image behaviour is unverified.
# Pin a version for the final demo, without editing this file:   TIKA_IMAGE=apache/tika:<version> docker compose ...
# Works the same under Podman (`podman compose`).
#
# To wire the backend to it, also merge docker-compose.text-backend.yml (see that file).
services:
  tika:
    image: ${TIKA_IMAGE:-apache/tika:latest}
    restart: unless-stopped
    ports:
      - "9998:9998"
