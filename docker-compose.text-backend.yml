# OVERRIDE for Person 3's main compose file: points the backend at Tika and MLflow. It is NOT valid alone
# (it extends a `backend` service that your main compose file must define). Use it merged:
#
#   docker compose -f docker-compose.yml -f text/docker-compose.tika.yml -f text/docker-compose.text-backend.yml up -d
#
# Assumes: the main compose file has a service named `backend`. If your MLflow service is not called
# `mlflow` on port 5000, set MLFLOW_TRACKING_URI in the environment or edit the default below.
# Merge behaviour with a stand-in `backend` service was checked with `docker compose config` (no daemon).
services:
  backend:
    environment:
      TIKA_URL: http://tika:9998
      TEXT_EXTRACTOR: auto              # auto = Tika, fall back to local libraries if Tika is down
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      TEXT_MODEL_SOURCE: auto           # auto = registry champion, fall back to models/text_svm.joblib
    depends_on:
      - tika
