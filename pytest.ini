[pytest]
testpaths = tests
markers =
    tika: needs a real Apache Tika server (set TIKA_TEST_URL, default http://localhost:9998); skipped if unreachable
    mlflow: needs the mlflow package; uses a temporary SQLite store, no server needed; skipped if mlflow is missing
    docker: needs a running Docker daemon; skipped otherwise
    fastapi: needs fastapi + httpx; skipped if missing
# Run only the tests that need no external service:
#   pytest -m "not tika and not mlflow and not docker and not fastapi"
